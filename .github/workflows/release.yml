name: Release candidate to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: SemVer marketing version (for example, 0.1.0)
        required: true
        type: string
      build_number:
        description: Monotonically increasing App Store Connect build number
        required: true
        type: string
      confirm_testflight_upload:
        description: Confirm this run may upload the signed IPA to TestFlight
        required: true
        default: DO_NOT_UPLOAD
        type: choice
        options:
          - DO_NOT_UPLOAD
          - UPLOAD

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-candidate:
    name: Signed archive and TestFlight upload
    runs-on: macos-15
    timeout-minutes: 60
    environment: testflight
    steps:
      - name: Require explicit upload confirmation
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_testflight_upload }}
        run: |
          set -euo pipefail
          [ "$CONFIRM_UPLOAD" = "UPLOAD" ] || {
            echo "::error::Upload was not confirmed. Re-run with confirm_testflight_upload=UPLOAD."
            exit 1
          }

      - name: Initialize runner paths
        run: |
          set -euo pipefail
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/WicketTally.xcarchive"
            echo "IPA_OUTPUT_PATH=$RUNNER_TEMP/WicketTallyIPA"
            echo "EVIDENCE_PATH=$RUNNER_TEMP/release-evidence"
          } >> "$GITHUB_ENV"

      - name: Check out selected release-candidate tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release inputs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [ "$REF_TYPE" = "tag" ] || {
            echo "::error::Release candidates must be dispatched from a tag, not $REF_TYPE."
            exit 1
          }
          python3 scripts/release/validate_release_inputs.py \
            --tag "$REF_NAME" \
            --marketing-version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER"
          tagged_commit=$(git rev-list -n 1 "$GITHUB_REF")
          actual_commit=$(git rev-parse HEAD)
          [ "$actual_commit" = "$tagged_commit" ] || {
            echo "::error::Checked-out commit does not match the selected tag."
            exit 1
          }
          echo "Release tag and checked-out commit: PASS"

      - name: Assert exact toolchain policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("toolchain.json").read_text())
          expected = {
              "xcode_version": "26.0.1",
              "xcode_build": "17A400",
              "iphoneos_sdk": "26.0",
              "bundle_identifier": "com.infinityball.wickettally",
              "targeted_device_family": "1",
              "native_ipad_support": False,
          }
          for key, value in expected.items():
              actual = policy.get(key)
              if actual != value:
                  raise SystemExit(
                      f"FAIL: toolchain.json {key} expected {value!r}, got {actual!r}"
                  )
          print("Repository release policy pins: PASS")
          PY

      - name: Select exact pinned Xcode (block if absent)
        run: |
          set -euo pipefail
          required_version="Xcode 26.0.1"
          required_build="17A400"
          selected=""
          for app in \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.0.1_*.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode.app
          do
            [ -d "$app" ] || continue
            developer_dir="$app/Contents/Developer"
            measured=$(DEVELOPER_DIR="$developer_dir" xcodebuild -version 2>/dev/null | tr -d '\r') || continue
            version_line=$(printf '%s\n' "$measured" | head -1)
            build_number=$(printf '%s\n' "$measured" | awk '/Build version/ { print $3 }')
            if [ "$version_line" = "$required_version" ] && [ "$build_number" = "$required_build" ]; then
              selected="$developer_dir"
              break
            fi
          done
          [ -n "$selected" ] || {
            echo "::error::ACCEPTANCE BLOCKER: required $required_version ($required_build) is absent from the Apple runner."
            exit 1
          }
          sudo xcode-select -s "$selected"
          [ "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.0" ] || {
            echo "::error::ACCEPTANCE BLOCKER: selected Xcode does not provide iphoneos SDK 26.0."
            exit 1
          }
          xcodebuild -version
          echo "Exact Xcode and iphoneos SDK policy: PASS"

      - name: Validate required secret names and install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY_ID:-}" ] || missing+=(ASC_KEY_ID)
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=(ASC_ISSUER_ID)
          [ -n "${ASC_KEY_P8:-}" ] || missing+=(ASC_KEY_P8)
          [ -n "${ASC_TEAM_ID:-}" ] || missing+=(ASC_TEAM_ID)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required GitHub secret: %s\n' "${missing[@]}"
            exit 1
          fi

          umask 077
          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$RUNNER_TEMP/asc-api-key.p8"
          mkdir -p "$key_directory"
          printf '%s' "$ASC_KEY_P8" > "$key_path"
          cp "$key_path" "$key_directory/AuthKey_${ASC_KEY_ID}.p8"
          openssl pkey -in "$key_path" -noout -check >/dev/null 2>&1 || {
            echo "::error::ASC_KEY_P8 is not a readable private key."
            exit 1
          }
          printf 'ASC_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
          echo "Required App Store Connect credentials are present (values not logged)."

      - name: Run zero-network release gate
        run: |
          set -euo pipefail
          bash scripts/check_zero_network.sh

      - name: Create signed App Store archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          scripts/release/run_secure.sh "$RUNNER_TEMP/archive.log" -- \
            xcodebuild -quiet \
              -project WicketTally.xcodeproj \
              -scheme WicketTally \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              MARKETING_VERSION="$MARKETING_VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              clean archive
          echo "Signed archive created."

      - name: Verify signed archive bundle policy
        env:
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_PATH"
          scripts/release/verify_archive.sh \
            "$ARCHIVE_PATH" \
            com.infinityball.wickettally \
            1 \
            "$MARKETING_VERSION" \
            "$BUILD_NUMBER" \
            "$ASC_TEAM_ID" \
            | tee "$EVIDENCE_PATH/archive-verification.txt"

          cp "$ARCHIVE_PATH/Products/Applications/WicketTally.app/Info.plist" \
            "$EVIDENCE_PATH/Info.plist"
          plutil -convert xml1 "$EVIDENCE_PATH/Info.plist"

      - name: Create signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          ipa=$(scripts/release/create_ipa.sh \
            "$ARCHIVE_PATH" \
            "$IPA_OUTPUT_PATH" \
            "$ASC_KEY_PATH")
          [ -n "$ipa" ] || {
            echo "::error::Signed IPA was not produced."
            exit 1
          }
          printf 'IPA_PATH=%s\n' "$ipa" >> "$GITHUB_ENV"
          echo "Signed IPA created."

      - name: Upload signed IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          scripts/release/run_secure.sh "$RUNNER_TEMP/upload.log" -- \
            xcrun altool \
              --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
          echo "App Store Connect accepted the upload. TestFlight processing and availability remain PENDING human verification."

      - name: Record non-secret release evidence
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_PATH"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "status": "UPLOAD_ACCEPTED_TESTFLIGHT_AVAILABILITY_PENDING",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "tag": os.environ["RELEASE_TAG"],
              "marketing_version": os.environ["MARKETING_VERSION"],
              "build_number": os.environ["BUILD_NUMBER"],
              "bundle_identifier": "com.infinityball.wickettally",
              "device_family": [1],
              "workflow_run_url": (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              "testflight_build_available": "PENDING HUMAN VERIFICATION",
              "app_store_submission": "NOT PERFORMED - MANUAL GATE",
          }
          Path(os.environ["EVIDENCE_PATH"], "release-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n"
          )
          PY

          {
            echo "## TestFlight release candidate"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version/build: \`$MARKETING_VERSION ($BUILD_NUMBER)\`"
            echo "- Bundle/device family: \`com.infinityball.wickettally\`, \`[1]\`"
            echo "- Upload: accepted by App Store Connect"
            echo "- TestFlight build availability: **PENDING human verification**"
            echo "- App Store submission: **NOT PERFORMED - manual gate**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testflight-evidence-${{ github.ref_name }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/release-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Remove API key and signed products
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/asc-api-key.p8"
          if [ -n "${ASC_KEY_ID:-}" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
          rm -rf "$ARCHIVE_PATH" "$IPA_OUTPUT_PATH"
          echo "Ephemeral signing key and signed products removed."
